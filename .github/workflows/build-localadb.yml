name: Build Local ADB Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LocalADB-Manager-Build-Ready-v1.0.1.zip'
      - '.github/workflows/build-localadb.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          unzip -q LocalADB-Manager-Android-Source.zip -d project
          test -f project/LocalADB-Manager/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project/LocalADB-Manager
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK=project/LocalADB-Manager/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalADBManager-debug-apk
          if-no-files-found: error
          path: |
            project/LocalADB-Manager/app/build/outputs/apk/debug/app-debug.apk
            project/LocalADB-Manager/app/build/outputs/apk/debug/app-debug.apk.sha256
